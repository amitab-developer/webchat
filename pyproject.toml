[project]
name = "templateon-webchat"
version = "0.1.0"
description = "Standalone generic web chat with document upload, analysis, and optional Cosmos persistence."
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.12.0",
  "azure-cosmos>=4.7.0",
  "azure-identity>=1.17.1",
  "fastapi>=0.115.0",
  "openai>=1.59.0",
  "pydantic-settings>=2.6.0",
  "pypdf>=5.1.0",
  "python-docx>=1.1.2",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.12",
  "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
  "debugpy>=1.8.21",
  "httpx>=0.28.1",
  "pytest>=8.3.4",
  "ruff>=0.8.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["src"]
